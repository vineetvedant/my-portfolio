<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="background:#15231f; font-family:'DM Sans', sans-serif;">
  <defs>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182d27"/>
      <stop offset="100%" stop-color="#0e1b17"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#gridGrad)"/>

  <!-- Top bar / Terminal Header -->
  <rect x="30" y="30" width="740" height="420" rx="10" fill="#1c2f29" stroke="#2e4d43" stroke-width="1.5"/>
  <rect x="30" y="30" width="740" height="45" rx="10" fill="#162521"/>
  <circle cx="55" cy="52" r="6" fill="#d9534f"/>
  <circle cx="75" cy="52" r="6" fill="#f0ad4e"/>
  <circle cx="95" cy="52" r="6" fill="#5cb85c"/>
  <text x="120" y="57" fill="#9bb3a8" font-size="13" font-weight="600" letter-spacing="0.05em">CRIS UTS — ACCESSIBILITY BRAILLE INTERFACE (Tkinter Prototype)</text>

  <!-- Left: Input Mockup -->
  <g transform="translate(60, 105)">
    <rect width="310" height="320" rx="8" fill="#142420" stroke="#264239" stroke-width="1"/>
    <text x="20" y="35" fill="#7cb39b" font-size="12" font-weight="700" letter-spacing="0.1em">TICKET INPUT PARAMETERS</text>

    <!-- UTS NO field -->
    <text x="20" y="75" fill="#d2ded6" font-size="13" font-weight="500">UTS Ticket No:</text>
    <rect x="20" y="88" width="270" height="36" rx="4" fill="#1e352f" stroke="#3b6255" stroke-width="1"/>
    <text x="32" y="112" fill="#ffffff" font-size="14" font-family="monospace">UTS-8942-NDLS</text>

    <!-- From Station -->
    <text x="20" y="155" fill="#d2ded6" font-size="13" font-weight="500">From Station:</text>
    <rect x="20" y="168" width="270" height="36" rx="4" fill="#1e352f" stroke="#3b6255" stroke-width="1"/>
    <text x="32" y="192" fill="#ffffff" font-size="14" font-family="monospace">NEW DELHI (NDLS)</text>

    <!-- To Station -->
    <text x="20" y="235" fill="#d2ded6" font-size="13" font-weight="500">To Station:</text>
    <rect x="20" y="248" width="270" height="36" rx="4" fill="#1e352f" stroke="#3b6255" stroke-width="1"/>
    <text x="32" y="272" fill="#ffffff" font-size="14" font-family="monospace">KANPUR CENTRAL (CNB)</text>
  </g>

  <!-- Center Arrow -->
  <g transform="translate(390, 240)">
    <circle cx="15" cy="15" r="20" fill="#145e50"/>
    <path d="M8 15h14m-5-5l5 5-5 5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right: Braille Translation Output -->
  <g transform="translate(440, 105)">
    <rect width="300" height="320" rx="8" fill="#142420" stroke="#264239" stroke-width="1"/>
    <text x="20" y="35" fill="#7cb39b" font-size="12" font-weight="700" letter-spacing="0.1em">BRAILLE UNICODE OUTPUT</text>

    <!-- Braille UTS -->
    <rect x="20" y="60" width="260" height="75" rx="6" fill="#19382f" stroke="#2e705f" stroke-width="1"/>
    <text x="30" y="85" fill="#a3cfbe" font-size="11" font-weight="600">UTS NO TRANSLATION:</text>
    <text x="30" y="120" fill="#5be3b6" font-size="28" font-weight="700" filter="url(#glow)">⠥⠞⠎ ⠝⠕ ⠓⠊⠙⠃</text>

    <!-- Braille ROUTE -->
    <rect x="20" y="150" width="260" height="75" rx="6" fill="#19382f" stroke="#2e705f" stroke-width="1"/>
    <text x="30" y="175" fill="#a3cfbe" font-size="11" font-weight="600">ROUTE TRANSLATION:</text>
    <text x="30" y="210" fill="#5be3b6" font-size="28" font-weight="700" filter="url(#glow)">⠝⠙⠇⠎ ➔ ⠉⠝⠃</text>

    <text x="20" y="265" fill="#8ca89c" font-size="12">Standard 6-dot Braille Unicode mapping</text>
    <text x="20" y="288" fill="#8ca89c" font-size="12">CRIS Station Inclusive Travel Prototype</text>
  </g>
</svg>
