<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f3f3f3" />
  <title>404 — Page Not Found · Vedant Singh</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@500;700&family=Syne:wght@800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .notfound-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .notfound-code {
      font-family: var(--font-heading, 'Syne', sans-serif);
      font-size: clamp(5rem, 15vw, 10rem);
      font-weight: 800;
      color: var(--blue, #0038ff);
      line-height: 1;
      letter-spacing: -0.05em;
      margin-bottom: 12px;
    }
    .notfound-title {
      font-family: var(--font-heading, 'Syne', sans-serif);
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      font-weight: 800;
      color: var(--text, #050505);
      margin-bottom: 16px;
    }
    .notfound-desc {
      font-size: 16px;
      color: var(--text-muted, #5e5e5e);
      max-width: 500px;
      margin-bottom: 28px;
    }
  </style>
</head>
<body>
  <div class="notfound-container">
    <div class="notfound-code">404</div>
    <h1 class="notfound-title">Page Not Found</h1>
    <p class="notfound-desc">The requested resource could not be found on sshconnect.space.</p>
    <a href="/" class="pill-btn-blue">Return to Homepage <span aria-hidden="true">→</span></a>
  </div>
</body>
</html>
